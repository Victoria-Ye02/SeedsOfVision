.app::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 62% 58% at 50% 52%,rgba(255,255,248,.62),rgba(255,255,248,.18) 70%,transparent);pointer-events:none}
.bed{display:none;position:absolute;left:0;right:0;bottom:0;height:56px;background:var(--soil);border-radius:50% 50% 0 0/24px 24px 0 0;box-shadow:inset 0 10px 0 var(--soil-2);pointer-events:none}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:72px 20px 80px;text-align:center;overflow-y:auto;animation:fade .45s ease both}
.my{font-family:var(--f-my);line-height:1.85}
.en{color:var(--ink-soft)}
h1,h2{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.3}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
button:focus-visible{outline:3px solid var(--btn);outline-offset:3px}

/* Language bar */
.topbar{position:absolute;top:12px;left:16px;right:16px;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;pointer-events:none}
.topbar>*{pointer-events:auto}
.langbar{display:flex;gap:4px;padding:4px;background:var(--card);border:2px solid var(--line);border-radius:999px;min-width:0;margin-left:auto}
.topback{flex:none;display:flex;align-items:center;gap:4px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:7px 14px 7px 10px;font-weight:700;font-size:.95rem;line-height:1.5;color:var(--ink)}
.topback:active{transform:scale(.96)}
.topback .ar{font-size:1.15rem;line-height:1}
@media (max-width:460px){.topback .lbl{display:none}.topback{padding:7px 12px}}
.langbar button{padding:6px 12px;border-radius:999px;font-weight:700;font-size:.9rem;line-height:1.5;color:var(--ink-soft);white-space:nowrap}
.langbar button[data-l="my"]{font-family:var(--f-my)}
.langbar button[data-l="ko"]{font-family:"Noto Sans KR",sans-serif}
.langbar button[data-l="en"],.langbar button[data-l="vi"]{font-family:"Nunito",sans-serif}
.langbar button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
@media (max-width:420px){.langbar button{padding:6px 9px;font-size:.82rem}}

.cta{background:var(--btn);color:var(--btn-ink);border-radius:999px;padding:14px 30px;font-weight:700;font-size:1.1rem;line-height:1.6;box-shadow:0 4px 0 color-mix(in srgb,var(--btn) 60%,#000);transition:transform .12s}
.cta:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--btn) 60%,#000)}

/* Home */
.home-tap{position:absolute;inset:0;z-index:0}
.home .stack{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:14px;pointer-events:none}
.home .cta{pointer-events:auto}
.bubble{background:var(--card);border:2px solid var(--line);border-radius:28px;padding:18px 30px;position:relative;max-width:min(44rem,100%)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-12px;width:20px;height:20px;background:var(--card);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.bubble .hi{font-family:"Baloo 2","Noto Sans KR",var(--f-my),sans-serif;font-size:clamp(1.4rem,3.2vw,2.1rem);font-weight:800;line-height:1.7}
.bubble .hi .my{font-weight:700}
.bubble .q{font-size:clamp(1.2rem,2.6vw,1.7rem);font-weight:700}
.home .cta{font-size:clamp(1.15rem,2.4vw,1.5rem);padding:16px 42px}
.home .stack{gap:18px}
.mascot{display:block;width:min(72vw,40vh,380px);aspect-ratio:1;max-width:100%;object-fit:cover;border-radius:50%;border:6px solid var(--card);box-shadow:0 10px 30px color-mix(in srgb,var(--soil) 30%,transparent);background:#f3e6d6}
.sparkle{position:absolute;width:10px;height:10px;background:#F2B632;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:twinkle 2.4s ease-in-out infinite}

/* Garden */
.garden{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 6px;max-width:44rem}
.sprout{display:flex;flex-direction:column;align-items:center;width:92px;animation:sproutUp .6s cubic-bezier(.3,1.5,.5,1) both}
.sprout svg{width:76px;height:auto}
.sprout b{font-family:var(--f-display);font-size:.95rem;line-height:1.5}
.sprout small{font-size:.72rem;color:var(--ink-soft);line-height:1.3}
.caption{font-size:1.2rem;font-weight:700;max-width:30rem;margin:0}

/* Garden: full-bleed video of the 7 seeds, controls on a soft panel at the bottom */
.garden-screen{justify-content:space-between;padding-top:76px;padding-bottom:32px;background:#cfe6b8}
.garden-screen::before{content:"";position:absolute;left:0;right:0;top:0;height:34%;background:linear-gradient(to bottom,rgba(20,35,15,.5),transparent);z-index:0;pointer-events:none}
.garden-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.garden-screen::after{content:"";position:absolute;left:0;right:0;bottom:0;height:28%;background:linear-gradient(to top,rgba(20,35,15,.55),transparent);z-index:0;pointer-events:none}
.garden-panel{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:14px}
.garden-panel .caption{color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.55);font-size:clamp(2.2rem,5vw,3.6rem);font-weight:800;line-height:1.3;max-width:min(90vw,56rem)}
#btnStart{font-size:clamp(1.4rem,3vw,2.1rem);padding:20px 56px}
#s-garden:not([hidden])~.bed,.app:has(#s-garden:not([hidden])) .bed{display:none}

/* Text that sits straight on the forest gets a soft light halo */
.qlabel,.qtext h2,.kicker,.kname,.caption,.done h2,.done .count,.restart,.progress{text-shadow:0 0 14px rgba(255,255,250,.95),0 0 4px rgba(255,255,250,.9)}
.garden-panel .caption{text-shadow:0 2px 10px rgba(0,0,0,.45)}
.restart{background:rgba(255,255,255,.7)}

/* Quiz */
.quiz{justify-content:flex-start;padding-top:84px}
.progress{display:flex;gap:8px;align-items:center}
.progress i{width:34px;height:8px;border-radius:8px;background:var(--line);transition:background .3s}
.progress i.on{background:var(--btn)}
.qlabel{font-size:.82rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);font-weight:700}
.qtext{max-width:34rem}
.qtext{max-width:42rem}
.qtext h2{font-size:clamp(1.5rem,3vw,2rem);font-weight:700;line-height:var(--lh)}
.opts{display:flex;flex-direction:column;gap:16px;width:100%;max-width:40rem}
.opt{display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:20px 22px;min-height:84px;gap:18px;transition:border-color .15s,transform .12s}
.opt:hover{border-color:var(--btn)}
.opt:active{transform:scale(.98)}
.opt.picked{border-color:var(--btn);background:color-mix(in srgb,var(--btn) 12%,var(--card))}
.opt .letter{flex:none;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--sky);font-family:"Baloo 2",sans-serif;font-weight:800;font-size:1.6rem;line-height:1}
.opt .txt{min-width:0;font-size:clamp(1.15rem,2.4vw,1.5rem);font-weight:700;line-height:var(--lh)}

/* Result */
.result{gap:10px;padding-top:64px;padding-bottom:24px}
.result .kname h1{font-size:2.2rem;line-height:1.25}
.result .msg{padding:12px 18px}
.result .hero{position:relative;display:flex;justify-content:center;max-width:100%}
.result .hero::before{content:"";position:absolute;inset:-10%;border-radius:40%;background:radial-gradient(closest-side,color-mix(in srgb,var(--k) 55%,transparent),transparent);animation:glow 2.6s ease-in-out infinite}
.cvid{position:relative;display:block;max-width:min(94vw,1100px);max-height:max(220px,min(62vh,calc(100vh - 300px),680px));min-height:max(200px,min(50vh,calc(100vh - 320px),560px));object-fit:cover;width:auto;height:auto;border-radius:24px;border:5px solid #fff;box-shadow:0 12px 34px rgba(30,50,20,.28);background:#e9f1df;animation:grow .8s cubic-bezier(.3,1.5,.5,1) both}
.done .cvid{max-height:min(40vh,380px);min-height:min(30vh,280px);border-width:4px}
.kicker{font-size:.85rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--ink-soft)}
.kname{display:flex;flex-direction:column;align-items:center}
.kname h1{font-size:2.5rem;color:var(--k);font-weight:800;line-height:1.35}
.kname .sub{font-size:1rem;color:var(--ink-soft);font-weight:700}
.msg{max-width:32rem;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px 20px;font-size:1.08rem;line-height:var(--lh)}

/* Action */
.steps{list-style:none;margin:0;padding:0;display:flex;align-items:center;justify-content:center;gap:10px;max-width:38rem;width:100%}
.step{position:relative;flex:1 1 0;min-width:0;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:22px 14px 18px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700;line-height:var(--lh)}
.step .num{position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:28px;height:28px;border-radius:50%;background:var(--k);color:#fff;font-family:"Baloo 2",sans-serif;font-weight:800;line-height:28px}
.step svg{width:60px;height:60px}
.arrow{flex:none;font-size:1.6rem;font-weight:800;color:var(--k)}
@media (max-width:480px){.steps{flex-direction:column}.step{width:100%}.arrow{transform:rotate(90deg)}}
.done{display:flex;flex-direction:column;align-items:center;gap:12px;max-width:30rem}
.done h2{font-size:1.5rem;max-width:100%;overflow-wrap:anywhere;text-wrap:balance}
.done .count{font-variant-numeric:tabular-nums;color:var(--ink-soft);font-size:.9rem}
.restart{color:var(--ink-soft);font-weight:700;padding:8px 14px;border-radius:999px;font-size:.95rem}

/* Intro video (plays before Home) */
.intro{position:absolute;inset:0;z-index:20;background:#1b120c;display:flex;align-items:center;justify-content:center;cursor:pointer;animation:fade .3s ease both}
.intro video{width:100%;height:100%;object-fit:cover;display:block}
.intro .skip{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.45);color:#fff;border-radius:999px;padding:8px 16px;font-weight:700;font-size:.9rem}
.intro .sound{position:absolute;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.45);color:#fff;border-radius:999px;padding:8px 14px;font-weight:700;font-size:.9rem}
.intro.out{opacity:0;transition:opacity .5s ease}

@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04,.97)}}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.15)}}
@keyframes sproutUp{from{opacity:0;transform:translateY(30px) scale(.3)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scale(.2) translateY(30px)}to{transform:none}}
@keyframes glow{0%,100%{opacity:.6;transform:scale(.92)}50%{opacity:1;transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-height:680px){.mascot{width:min(72vw,36vh,240px)}.kname h1{font-size:2rem}}
.rinfo,.dinfo{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0}
.qhead{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0}

/* ===== Phone: tighter spacing so every step fits without scrolling ===== */
@media (max-width:520px){
  .screen{padding:68px 16px 28px;gap:14px}
  .bubble{padding:14px 18px}
  .opt{padding:14px 16px;min-height:68px;gap:14px}
  .opt .letter{width:44px;height:44px;font-size:1.3rem}
  .cvid{max-height:46vh;min-height:34vh}
  .result .kname h1{font-size:1.9rem}
  .msg{font-size:1rem}
  .garden-panel .caption{font-size:2rem}
  #btnStart{font-size:1.35rem;padding:16px 36px}
}
</style>
</head>
<body>

<div class="app" id="app">

        <span class="sparkle" style="right:-4%;top:10%;animation-delay:1s;background:#5DB7EA"></span>
        <span class="sparkle" style="right:2%;top:60%;animation-delay:1.7s;background:#EC6F98"></span>
      </div>
      <button class="cta" id="btnBegin" data-t="begin"></button>

  </section>

  <!-- 2 Garden -->
  <section class="screen garden-screen" id="s-garden" hidden aria-label="Seed Garden">

  <!-- 5 Action -->
  <section class="screen" id="s-action" hidden aria-label="Action">
    <div id="actPick" style="display:flex;flex-direction:column;align-items:center;gap:20px;width:100%">

          <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 6C50 14 56 34 32 58 8 34 14 14 32 6Z" fill="var(--k)"/><path d="M32 12V54" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".7"/><path d="M32 26l-9-6M32 36l10-7M32 46l-8-6" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".6"/></svg>

</div>

const N_ASK = 4;
function pickQuestions(){
  const idx = BANK.map((_,i) => i);
  for (let i = idx.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  return idx.slice(0, N_ASK);
}
let QS = pickQuestions().map(i => BANK[i]);
let msgIdx = 0;

function seed(color, emblem, opts={}){
  const leaf = opts.leaf || color;
  const em = emblem ? EMB[emblem].replaceAll('"C"', `"${color}"`) : '';
  return `<svg viewBox="0 0 120 142" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    ${em}
    <path d="M60 50V30" stroke="${leaf}" stroke-width="4" stroke-linecap="round"/>

    <ellipse cx="38" cy="106" rx="7" ry="4.5" fill="#ff9fb8" opacity=".55"/>

/* ================= State ================= */
const $ = id => document.getElementById(id);
const screens = ["home","garden","quiz","result","action"];
let lang = "my";
try { lang = localStorage.getItem("myseed-lang") || "my"; } catch(e){}
let answers = [], qi = 0, result = null, doneAct = null, idleTimer = null, countdown = null, countN = 0;
const t = k => UI[lang][k];
const current = () => screens.find(s => !$("s-"+s).hidden);

function setLang(l){
  lang = l;
  try { localStorage.setItem("myseed-lang", l); } catch(e){}
  document.documentElement.lang = l;
  document.querySelectorAll("#langbar button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === l));
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  $("backLbl").textContent = t("back").replace(/^←\s*/, "");
  $("btnBack").setAttribute("aria-label", $("backLbl").textContent);
  $("btnNext").textContent = t("next");
  $("btnRestart").textContent = t("restart");
  // re-render dynamic screens in place (no animation replay)
  renderGarden(false);
  if (current() === "quiz") renderQ();
  if (result) renderResult();
  if (doneAct) renderDone();
}
$("langbar").onclick = e => { const b = e.target.closest("button"); if (b) setLang(b.dataset.l); };

function show(name){
  screens.forEach(s => $("s-"+s).hidden = s !== name);
  const el = $("s-"+name); el.style.animation="none"; el.offsetHeight; el.style.animation="";
  armIdle(name);
}

/* Kiosk: return to Home after 60s of no touch (except on Home) */
/* Kiosk: 10 s with no touch on any screen → back to the intro video */
const IDLE_MS = 10000;
const IDLE_SCREENS = ["home","garden"];   // no timer from the questions onward
function armIdle(name){
  clearTimeout(idleTimer);
  if (name && introDone && IDLE_SCREENS.includes(name)) idleTimer = setTimeout(reset, IDLE_MS);
}
["pointerdown","keydown"].forEach(ev => document.addEventListener(ev, () => {
  const cur = current();
  if (!doneAct) armIdle(cur);
}));

function reset(){
  clearInterval(countdown); clearTimeout(idleTimer);
  answers = []; qi = 0; result = null; doneAct = null;
  $("actPick").hidden = false; $("actDone").hidden = true; $("btnRestart").hidden = false;
  show("home");
  playIntro();
}

/* ---------- Intro video: plays first, then reveals Home ---------- */
const vid = $("introVid");
var introDone = false;
function playIntro(){
  introDone = false; clearTimeout(idleTimer);
  const el = $("intro");
  el.classList.remove("out"); el.hidden = false;
  try { vid.currentTime = 0; } catch(e){}
  const p = vid.play();
  if (p && p.catch) p.catch(() => {}); // autoplay blocked → first tap skips to Home
}
function endIntro(){
  if (introDone) return; introDone = true;
  const el = $("intro");
  el.classList.add("out");
  setTimeout(() => { el.hidden = true; vid.pause(); }, 500);
  show("home");
}
vid.addEventListener("error", endIntro);
$("intro").addEventListener("click", e => { if (!e.target.closest("#btnSound")) endIntro(); });
$("btnSound").onclick = () => {
  vid.muted = !vid.muted;
  $("btnSound").textContent = vid.muted ? "🔇" : "🔊";
  $("btnSound").setAttribute("aria-pressed", String(!vid.muted));
  if (vid.paused) vid.play().catch(() => {});
};

/* Videos: play only while their screen is visible */
function syncVideos(){
  const cur = current();
  const m = $("mascot"), g = $("gardenVid");
  if (cur === "home") m.play().catch(()=>{}); else m.pause();
  if (cur === "garden") { try{ g.currentTime = 0; }catch(e){} g.play().catch(()=>{}); } else g.pause();
  document.querySelectorAll(".cvid").forEach(v => {
    const on = !v.closest("[hidden]");
    if (on) v.play().catch(()=>{}); else v.pause();
  });
}
new MutationObserver(syncVideos).observe($("app"), {subtree:true, attributes:true, attributeFilter:["hidden"]});

function renderGarden(animate){
  $("garden").innerHTML = ORDER.map((k,i) =>
    `<div class="sprout" style="${animate ? `animation-delay:${(i*0.2).toFixed(1)}s` : 'animation:none'}">${seed(K[k].c, K[k].e)}<b style="color:${K[k].c}">${K[k].name[lang]}</b>${lang!=="en"?`<small>${k}</small>`:""}</div>`
  ).join("");
}
function openGarden(){ renderGarden(true); show("garden"); }
$("homeTap").onclick = openGarden;
$("btnBegin").onclick = openGarden;
$("btnStart").onclick = () => { QS = pickQuestions().map(i => BANK[i]); answers=[]; qi=0; renderQ(); show("quiz"); };

function renderQ(){
  const q = QS[qi];
  [...$("progress").children].forEach((b,i) => b.classList.toggle("on", i <= qi));
  $("qlabel").textContent = `${qi+1} / ${N_ASK}`;
  $("qtext").textContent = q.q[lang];
  $("opts").innerHTML = q.o.map((o,i) =>
    `<button class="opt${answers[qi]===i?' picked':''}" data-i="${i}"><span class="letter">${"ABC"[i]}</span><span class="txt">${o.t[lang]}</span></button>`
  ).join("");
}
$("opts").onclick = e => {
  const b = e.target.closest(".opt"); if (!b || $("opts").dataset.lock) return;
  answers[qi] = +b.dataset.i; b.classList.add("picked");
  $("opts").dataset.lock = "1";
  setTimeout(() => {
    delete $("opts").dataset.lock;
    if (qi < N_ASK - 1){ qi++; renderQ(); const s=$("s-quiz"); s.style.animation="none"; s.offsetHeight; s.style.animation=""; }
    else { result = score(answers); msgIdx = Math.floor(Math.random() * 3); renderResult(); show("result"); playWin(); }
  }, 280);
};
/* ---------- Back button: every screen steps back one place ---------- */
$("btnBack").onclick = () => {
  const cur = current();
  if (cur === "home") { playIntro(); }
  else if (cur === "garden") { show("home"); }
  else if (cur === "quiz") {
    if (qi > 0) { qi--; renderQ(); const s=$("s-quiz"); s.style.animation="none"; s.offsetHeight; s.style.animation=""; }
    else { renderGarden(false); show("garden"); }
  }
  else if (cur === "result") { qi = 3; renderQ(); show("quiz"); }
  else if (cur === "action") {
    if (doneAct) {
      clearInterval(countdown); doneAct = null;
      $("actPick").hidden = false; $("actDone").hidden = true; $("btnRestart").hidden = false;
      armIdle("action");
    } else { show("result"); }
  }
};

/* ================= Scoring (spec §4) =================
   +2 primary, +1 secondary per answer; highest total wins.
   Tie: Q4's primary keyword decides. If Q4's primary is not among the tied
   keywords (11 of 81 combinations), fall back to Q4's secondary, then
   Q3, Q2, Q1 answers in order, so the result is always a tied top keyword. */
function score(ans){
  const c = Object.fromEntries(ORDER.map(k => [k,0]));
  ans.forEach((a,i) => { const o = QS[i].o[a]; c[o.p]+=2; c[o.s]+=1; });
  const max = Math.max(...Object.values(c));
  const tied = ORDER.filter(k => c[k] === max);
  if (tied.length === 1) return tied[0];
  for (let i = 3; i >= 0; i--){
    const o = QS[i].o[ans[i]];
    for (const k of [o.p, o.s]) if (tied.includes(k)) return k;
  }
  return tied[0];
}

/* ---------- Winning fanfare on the result screen (Web Audio, no file needed) ---------- */
let actx = null;
function audio(){
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return null; }
  if (actx.state === "suspended") actx.resume().catch(()=>{});
  return actx;
}
document.addEventListener("pointerdown", () => { audio(); }, {once:true});
function tone(ctx, freq, start, dur, type, vol){
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, start);
  g.gain.setValueAtTime(0.0001, start);
  g.gain.exponentialRampToValueAtTime(vol, start + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
  o.connect(g).connect(ctx.destination); o.start(start); o.stop(start + dur + 0.05);
}
function playWin(){
  const ctx = audio(); if (!ctx) return;
  const t0 = ctx.currentTime + 0.05;
  // rising arpeggio C5 E5 G5 C6, then a bright C-major chord with a sparkle on top
  [523.25, 659.25, 783.99, 1046.5].forEach((f,i) => { tone(ctx, f, t0 + i*0.11, 0.35, "triangle", 0.22); tone(ctx, f*2, t0 + i*0.11, 0.2, "sine", 0.05); });
  const tc = t0 + 0.48;
  [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach(f => tone(ctx, f, tc, 1.4, "triangle", 0.12));
  [2093, 2637, 3136, 2637, 3520].forEach((f,i) => tone(ctx, f, tc + 0.08 + i*0.07, 0.25, "sine", 0.05));
}

function renderResult(){
  const k = result;
  document.documentElement.style.setProperty("--k", K[k].c);
  if (!$("rHero").dataset.k || $("rHero").dataset.k !== k){ $("rHero").innerHTML = vidTag(k); $("rHero").dataset.k = k; }
  $("rName").textContent = K[k].name[lang];
  $("rSub").textContent = lang === "en" ? "" : k;
  $("rMsg").textContent = K[k].msg[lang][msgIdx];
}
$("btnNext").onclick = () => show("action");

function renderDone(){
  $("doneText").textContent = t("done");
}
$("btnGo").onclick = () => {
  doneAct = true;
  $("doneSeed").innerHTML = vidTag(result);
  $("actPick").hidden = true; $("actDone").hidden = false; $("btnRestart").hidden = true;
  clearTimeout(idleTimer); clearInterval(countdown);
  renderDone();
};
$("btnAgain").onclick = reset;
$("btnRestart").onclick = reset;

setLang(lang);
playIntro();
